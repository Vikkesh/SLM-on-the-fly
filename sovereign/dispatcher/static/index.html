<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sovereign AI Workbench</title>
<style>
  :root { --bg:#0f1419; --panel:#161c24; --line:#273241; --fg:#e6edf3; --muted:#8b97a6;
          --accent:#f5a524; --ok:#2ecc71; --bad:#e74c3c; --vision:#5dade2; --doc:#f5a524; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; letter-spacing:.3px; }
  header .sub { color:var(--muted); font-size:13px; }
  .pills { margin-left:auto; display:flex; gap:8px; }
  .pill { font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .pill.ok { border-color:var(--ok); color:var(--ok); } .pill.bad { border-color:var(--bad); color:var(--bad); }
  main { max-width:1080px; margin:0 auto; padding:20px 24px 80px; }
  .composer { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  textarea { width:100%; min-height:88px; background:transparent; color:var(--fg); border:0; resize:vertical; font:inherit; outline:none; }
  .row { display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  input[type=file] { color:var(--muted); font-size:13px; }
  button { background:var(--accent); color:#111; border:0; border-radius:8px; padding:9px 18px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:wait; }
  .turn { margin-top:22px; }
  .user { color:var(--muted); font-size:13px; margin-bottom:6px; white-space:pre-wrap; }
  .banner { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; padding:6px 12px;
            border-radius:8px; background:#1d2633; border:1px solid var(--line); margin-bottom:10px; }
  .hop { padding:2px 8px; border-radius:6px; font-weight:600; }
  .hop.vision { background:rgba(93,173,226,.15); color:var(--vision); }
  .hop.doc { background:rgba(245,165,36,.15); color:var(--doc); }
  .arrow { color:var(--muted); }
  .answer { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; white-space:pre-wrap; }
  .files a { display:inline-block; margin:8px 8px 0 0; padding:6px 12px; border-radius:8px; background:rgba(46,204,113,.12);
             color:var(--ok); text-decoration:none; border:1px solid rgba(46,204,113,.4); font-size:13px; }
  details { margin-top:8px; color:var(--muted); font-size:12.5px; }
  details pre { white-space:pre-wrap; margin:6px 0 0; }
  .error { border-color:var(--bad); color:#ffb4ad; }
  .spinner { color:var(--muted); font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<header>
  <div><h1>Sovereign AI Workbench</h1><div class="sub">on-premise · air-gapped · two local models</div></div>
  <div class="pills">
    <span id="p-tf" class="pill">TrueForge</span>
    <span id="p-ol" class="pill">Model server</span>
  </div>
</header>
<main>
  <div class="composer">
    <textarea id="prompt" placeholder="Ask a question, or attach a scan / spreadsheet / PDF and say what you need…"></textarea>
    <div class="row">
      <input id="files" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp,.pdf,.xlsx,.csv,.docx,.txt,.md">
      <span style="flex:1"></span>
      <button id="new" class="ghost" type="button">New session</button>
      <button id="send" type="button">Send</button>
    </div>
  </div>
  <div id="log"></div>
</main>
<script>
const $ = s => document.querySelector(s);
let clientSession = "";
const modelOf = {};

async function health() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("#p-tf").className = "pill " + (h.trueforge ? "ok" : "bad");
    $("#p-ol").className = "pill " + (h.ollama ? "ok" : "bad");
    $("#p-ol").textContent = "Model server" + (h.ollama ? " · " + h.models.vision + " / " + h.models.doc : " · unreachable");
  } catch { $("#p-tf").className = $("#p-ol").className = "pill bad"; }
}
health(); setInterval(health, 8000);

function hopClass(agent) { return agent.toLowerCase().startsWith("vision") ? "vision" : "doc"; }

function render(prompt, fileNames, data, isError) {
  const el = document.createElement("section"); el.className = "turn";
  const who = fileNames.length ? prompt + "\n[" + fileNames.join(", ") + "]" : prompt;
  let html = `<div class="user">You: ${esc(who)}</div>`;
  if (isError) {
    html += `<div class="answer error">${esc(data.error || "Request failed")}</div>`;
  } else {
    const hops = data.routed.map(h => `<span class="hop ${hopClass(h.agent)}">${esc(h.agent)} (${esc(h.model)})</span>`).join(`<span class="arrow">→</span>`);
    html += `<div class="banner">Routed to: ${hops}</div>`;
    html += `<div class="answer">${esc(data.answer || "(no text)")}</div>`;
    if (data.files.length) html += `<div class="files">` + data.files.map(f => `<a href="${f.url}" download>⬇ ${esc(f.name)}</a>`).join("") + `</div>`;
    const tools = data.routed.flatMap(h => h.tool_calls.map(t => h.agent + " → " + t));
    html += `<details><summary>Why this route · ${esc(data.route_reason)}${data.context_docs.length ? " · context: " + esc(data.context_docs.join(", ")) : ""}${tools.length ? " · tools: " + esc(tools.join(", ")) : ""}</summary><pre>${esc(data.trace.join("\n"))}${data.extracted && data.routed.length > 1 ? "\n\n--- Vision Agent extraction ---\n" + esc(data.extracted) : ""}</pre></details>`;
  }
  el.innerHTML = html; $("#log").prepend(el);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("#send").onclick = async () => {
  const prompt = $("#prompt").value.trim(); const files = [...$("#files").files];
  if (!prompt && !files.length) return;
  const fd = new FormData(); fd.append("prompt", prompt); fd.append("client_session", clientSession);
  files.forEach(f => fd.append("files", f, f.name));
  $("#send").disabled = true;
  const wait = document.createElement("div"); wait.className = "spinner"; wait.textContent = "Routing…"; $("#log").prepend(wait);
  try {
    const r = await fetch("/api/ask", { method: "POST", body: fd });
    const data = await r.json(); wait.remove();
    if (data.client_session) clientSession = data.client_session;
    render(prompt, files.map(f => f.name), data, !r.ok);
    if (r.ok) { $("#prompt").value = ""; $("#files").value = ""; }
  } catch (e) { wait.remove(); render(prompt, files.map(f => f.name), { error: "Dispatcher unreachable: " + e.message }, true); }
  $("#send").disabled = false;
};
$("#new").onclick = () => { clientSession = ""; $("#log").innerHTML = ""; };
$("#prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#send").click(); });
</script>
</body>
</html>
