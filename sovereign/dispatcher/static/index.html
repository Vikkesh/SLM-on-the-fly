<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAI: Sovereign Agentic Intelligence</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
  :root {
    --bg: #1b1b1b; --rail: #151515; --surface: #262626; --surface-2: #2e2e2e; --line: #343434; --line-soft: #2b2b2b;
    --ink: #ececec; --muted: #9b9b9b; --accent: #e75a9b; --accent-ink: #fff; --teal: #41b1b5;
    --read: #41b1b5; --write: #e75a9b; --local: #8b8b8b; --tool: #e8a33d; --file: #4cc38a; --danger: #ff7b72; --focus: #41b1b5;
    --font: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    --rail-w: 232px; --col: 760px;
  }
  html[data-theme="light"] {
    --bg: #f5f6f7; --rail: #ededee; --surface: #ffffff; --surface-2: #f2f3f4; --line: #dcdfe3; --line-soft: #e8eaed;
    --ink: #17202a; --muted: #5f6b78; --local: #6b7280; --file: #1f7a45; --danger: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--font); }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: inherit; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Shell ---------------------------------------------------------------------------------- */
  .shell { display: grid; grid-template-columns: var(--rail-w) 1fr; height: 100%; }
  .rail { background: var(--rail); border-right: 1px solid var(--line); padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 6px 8px; }
  .logo img { width: 34px; height: 34px; }
  .logo b { font-size: 15px; font-weight: 650; letter-spacing: .01em; }
  .logo small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .newchat { display: flex; align-items: center; gap: 9px; width: 100%; padding: 11px 12px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  .newchat:hover { filter: brightness(1.06); }
  .rail h2 { margin: 6px 6px 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: none; }
  .status, .legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; padding: 0 6px; }
  .status .row, .legend .row { display: flex; align-items: center; gap: 9px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.ok { background: var(--file); } .dot.bad { background: var(--danger); }
  .status .sub { color: var(--muted); font-size: 12px; margin-left: 17px; line-height: 1.4; }
  .legend .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .legend small { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .rail .grow { flex: 1; }
  .railbtn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; font-size: 13px; }
  .railbtn:hover { background: var(--surface); color: var(--ink); }

  .main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .top { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--ink); }
  .top .sess { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  .scroll { flex: 1; overflow: auto; padding: 28px 24px 12px; }
  .col { max-width: var(--col); margin: 0 auto; }

  /* Empty state: hero + composer sit together in the middle of the page ---------------------- */
  .main.empty .scroll { display: none; }
  .main.empty .dock { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 60px; }
  .hero { display: none; text-align: center; margin-bottom: 26px; }
  .main.empty .hero { display: block; }
  .hero img { width: 62px; height: 62px; }
  .hero h1 { margin: 16px 0 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .starters { display: none; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  .main.empty .starters { display: flex; }
  .starters button { padding: 7px 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; cursor: pointer; font-size: 12.5px; }
  .starters button:hover { color: var(--ink); border-color: var(--muted); }

  /* Turns ---------------------------------------------------------------------------------- */
  .turn { margin-bottom: 30px; }
  .you { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .you .bubble { max-width: 80%; background: var(--surface-2); border-radius: 14px 14px 4px 14px; padding: 10px 14px; white-space: pre-wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); margin: 6px 6px 0 0; }
  .chip .x { border: 0; background: none; cursor: pointer; padding: 0 2px; color: var(--muted); font-size: 15px; line-height: 1; }

  .track { display: flex; align-items: center; margin: 0 0 12px; flex-wrap: wrap; row-gap: 8px; }
  .track .label { color: var(--muted); font-size: 12.5px; margin-right: 10px; }
  .node { display: inline-flex; align-items: baseline; gap: 8px; padding: 5px 11px 5px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
  .node::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); align-self: center; }
  .node.read::before { background: var(--read); } .node.write::before { background: var(--write); } .node.local::before { background: var(--local); }
  .node.pending { color: var(--muted); } .node.pending::before { background: var(--line); }
  .node.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(231, 90, 155, .18); }
  .node.active::before { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.55); opacity: .55; } }
  .node b { font-weight: 600; } .node .model, .node .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .node .tool { color: var(--tool); font-size: 12px; }
  .link { width: 20px; height: 2px; background: var(--line); flex: none; }
  .link.done { background: var(--accent); }

  .answer { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; padding: 16px 20px; overflow-wrap: anywhere; }
  .answer :first-child { margin-top: 0; } .answer :last-child { margin-bottom: 0; }
  .answer p { margin: 0 0 12px; } .answer ul, .answer ol { margin: 0 0 12px; padding-left: 22px; }
  .answer h3, .answer h4 { font-size: 15px; margin: 16px 0 6px; font-weight: 650; }
  .answer code { font: 13px/1.4 var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .answer pre { background: var(--surface-2); padding: 12px 14px; border-radius: 8px; overflow: auto; font: 13px/1.5 var(--mono); }
  .answer pre code { background: none; padding: 0; }
  .answer table { border-collapse: collapse; margin: 6px 0 12px; font-size: 13.5px; width: 100%; }
  .answer th, .answer td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
  .answer th { background: var(--surface-2); font-weight: 600; }
  .answer .caret { display: inline-block; width: 2px; height: 1em; background: var(--ink); vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .answer .reading { color: var(--muted); font-style: italic; }
  .answer.error { border-color: var(--danger); }
  .answer.error .msg { color: var(--danger); }
  .answer.error .fix { margin-top: 10px; }

  .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .files a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 13px; }
  .files a:hover { border-color: var(--file); }
  .files .ext { font: 600 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 4px; background: var(--file); color: #0b1a10; }

  details.how { margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  details.how summary { cursor: pointer; }
  details.how .grid { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 8px 0 0; }
  details.how .grid b { font-weight: 600; color: var(--ink); }
  details.how pre { font: 12px/1.5 var(--mono); white-space: pre-wrap; margin: 8px 0 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px 12px; }
  details.how .extract { max-height: 260px; overflow: auto; }

  /* Composer ------------------------------------------------------------------------------- */
  .dock { padding: 8px 24px 18px; }
  .composer { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 10px; }
  .main:not(.empty) .composer { max-width: var(--col); }
  .composer.drag { border-color: var(--accent); }
  .composer textarea { width: 100%; border: 0; resize: none; min-height: 44px; max-height: 240px; padding: 4px 6px; outline: none; background: transparent; line-height: 1.5; }
  .composer textarea::placeholder { color: var(--muted); }
  .composer .pending { padding: 0 4px; }
  .composer .bar { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; position: relative; }
  .iconbtn:hover { background: var(--surface-2); color: var(--ink); }
  .composer .spacer { flex: 1; }
  .modelpill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); padding: 5px 10px; border-radius: 8px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modelpill .m { color: var(--ink); }
  .send { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-ink); cursor: pointer; margin-left: 6px; }
  .send:hover { filter: brightness(1.06); }
  .send[disabled] { background: var(--line); color: var(--muted); cursor: not-allowed; }
  .tools-pop { position: absolute; bottom: 40px; left: 0; min-width: 260px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; text-align: left; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 5; }
  .tools-pop div { padding: 5px 12px; color: var(--ink); } .tools-pop small { color: var(--muted); display: block; }
  .tools-pop[hidden] { display: none; }
  .hint { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 8px; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; gap: 12px; padding: 10px 12px; }
    .rail .grow, .legend, .rail h2 { display: none; }
    .newchat { width: auto; }
    .scroll, .dock { padding-left: 14px; padding-right: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .node.active::before, .answer .caret { animation: none; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="logo"><img src="/static/logo.png" alt=""><div><b>SAI</b><small>Sovereign Agentic Intelligence</small></div></div>
    <button class="newchat" id="new" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>New chat
    </button>
    <section>
      <h2>System</h2>
      <div class="status">
        <div class="row"><span class="dot" id="d-tf"></span>Agent engine</div>
        <div class="row"><span class="dot" id="d-ol"></span>Model server</div>
        <div class="sub" id="s-models">checking…</div>
        <div class="row"><span class="dot" id="d-tools"></span>Document tools</div>
      </div>
    </section>
    <section>
      <h2>How requests are routed</h2>
      <div class="legend">
        <div class="row"><span class="swatch" style="background:var(--read)"></span>Reader<small id="l-read">scans, photos, PDFs</small></div>
        <div class="row"><span class="swatch" style="background:var(--write)"></span>Writer<small>questions, documents</small></div>
        <div class="row"><span class="swatch" style="background:var(--tool)"></span>Tools<small>Word, PDF, Excel, OCR</small></div>
      </div>
    </section>
    <div class="grow"></div>
    <button class="railbtn" id="theme" type="button"><svg viewBox="0 0 24 24" id="theme-ico"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="theme-label">Light</span></button>
  </aside>

  <main class="main empty" id="main">
    <div class="top">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span id="title">New chat</span>
      <span class="sess" id="sess"></span>
    </div>
    <div class="scroll" id="scroll"><div class="col" id="log"></div></div>
    <div class="dock">
      <div class="hero"><img src="/static/logo.png" alt=""><h1>How can I help you today?</h1></div>
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Ask anything… (Shift+Enter for new line)" aria-label="Your request"></textarea>
        <div class="pending" id="pending"></div>
        <div class="bar">
          <button class="iconbtn" id="toolsbtn" type="button" aria-label="Available tools" title="Available tools">
            <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5l-9.4 9.4a2.1 2.1 0 0 1-3-3l9.4-9.4Z"/><path d="M14.7 6.3 17.5 3.5a4 4 0 0 1 3 3l-2.8 2.8"/></svg>
            <div class="tools-pop" id="toolspop" hidden></div>
          </button>
          <label class="iconbtn" for="files" title="Attach files" aria-label="Attach files">
            <svg viewBox="0 0 24 24"><path d="m21.4 11.05-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </label>
          <input id="files" type="file" multiple hidden accept=".png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp,.pdf,.xlsx,.csv,.docx,.txt,.md">
          <span class="spacer"></span>
          <span class="modelpill" id="modelpill" title="Models on the server"><svg viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16V9M12 16V5M16 16v-4"/></svg><span class="m" id="modelname">…</span></span>
          <button class="send" id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
        </div>
      </form>
      <div class="starters" id="starters">
        <button type="button" data-prompt="What is the maximum allowable pressure for V-102, and what happens if it is exceeded?">Ask about an SOP</button>
        <button type="button" data-prompt="Draft the approval note for this inspection report as a Word document." data-sample="inspection-report-V102.png">Scan → approval note (.docx)</button>
        <button type="button" data-prompt="Draft the approval note for this inspection report as a PDF." data-sample="inspection-report-V102.png">Scan → approval note (.pdf)</button>
        <button type="button" data-prompt="Summarise these readings against the pump limits and flag anything that needs action." data-sample="p301-readings.xlsx">Check a spreadsheet</button>
      </div>
      <div class="hint">Runs entirely on this network. Files never leave the room.</div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const state = { session: "", files: [], busy: false, models: {}, last: null, turns: 0 };

  // ---- theme -------------------------------------------------------------------------------
  const applyTheme = t => { document.documentElement.dataset.theme = t; $("#theme-label").textContent = t === "light" ? "Dark" : "Light"; try { localStorage.setItem("sai-theme", t); } catch {} };
  try { applyTheme(localStorage.getItem("sai-theme") || "dark"); } catch { applyTheme("dark"); }
  $("#theme").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"));

  // ---- system status -----------------------------------------------------------------------
  const TOOLS = [["generate_docx", "Word document"], ["generate_pdf", "PDF document"], ["generate_xlsx", "Excel workbook"], ["extract_from_scan", "OCR a scan"], ["list_outputs", "What has been generated"]];
  $("#toolspop").innerHTML = TOOLS.map(([n, d]) => `<div>${n}<small>${d}</small></div>`).join("");
  $("#toolsbtn").addEventListener("click", e => { e.preventDefault(); const p = $("#toolspop"); p.hidden = !p.hidden; });
  document.addEventListener("click", e => { if (!e.target.closest("#toolsbtn")) $("#toolspop").hidden = true; });

  async function health() {
    try {
      const h = await (await fetch("/api/health")).json();
      state.models = h.models;
      $("#d-tf").className = "dot " + (h.trueforge ? "ok" : "bad");
      $("#d-ol").className = "dot " + (h.ollama ? "ok" : "bad");
      $("#d-tools").className = "dot ok";
      const same = h.models.vision === h.models.doc;
      $("#s-models").textContent = h.ollama ? (same ? h.models.doc : `${h.models.vision} reads · ${h.models.doc} writes`) + (h.vision_mode === "ocr" ? " · images via OCR" : "") : "model server unreachable";
      $("#modelname").textContent = same ? h.models.doc : `${h.models.doc} · ${h.models.vision}`;
      $("#l-read").textContent = h.vision_mode === "ocr" ? "scans via local OCR" : "scans, photos, PDFs";
    } catch {
      $("#d-tf").className = $("#d-ol").className = $("#d-tools").className = "dot bad";
      $("#s-models").textContent = "workbench unreachable";
    }
  }
  health(); setInterval(health, 10000);

  // ---- attachments -------------------------------------------------------------------------
  function addFiles(list) { for (const f of list) if (!state.files.some(x => x.name === f.name && x.size === f.size)) state.files.push(f); renderPending(); }
  function renderPending() {
    $("#pending").innerHTML = state.files.map((f, i) => `<span class="chip">${esc(f.name)} <button class="x" type="button" data-i="${i}" aria-label="Remove ${esc(f.name)}">×</button></span>`).join("");
  }
  $("#pending").addEventListener("click", e => { const b = e.target.closest(".x"); if (!b) return; state.files.splice(+b.dataset.i, 1); renderPending(); });
  $("#files").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
  const main = $("#main");
  ["dragenter", "dragover"].forEach(ev => main.addEventListener(ev, e => { e.preventDefault(); $("#composer").classList.add("drag"); }));
  ["dragleave", "drop"].forEach(ev => main.addEventListener(ev, e => { e.preventDefault(); $("#composer").classList.remove("drag"); }));
  main.addEventListener("drop", e => addFiles(e.dataTransfer.files));
  document.addEventListener("paste", e => { const fs = [...e.clipboardData.files]; if (fs.length) addFiles(fs); });
  async function attachSample(name) { const r = await fetch("/samples/" + name); if (r.ok) addFiles([new File([await r.blob()], name)]); }
  $("#starters").addEventListener("click", async e => {
    const b = e.target.closest("button[data-prompt]"); if (!b) return;
    ta.value = b.dataset.prompt; grow();
    if (b.dataset.sample) await attachSample(b.dataset.sample);
    ta.focus();
  });

  // ---- composer ----------------------------------------------------------------------------
  const ta = $("#prompt");
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 240) + "px"; };
  ta.addEventListener("input", grow);
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } });
  $("#composer").addEventListener("submit", e => { e.preventDefault(); send(); });
  $("#new").addEventListener("click", () => {
    state.session = ""; state.files = []; state.turns = 0; renderPending(); $("#log").innerHTML = "";
    main.classList.add("empty"); $("#title").textContent = "New chat"; $("#sess").textContent = ""; ta.value = ""; grow(); ta.focus();
  });

  // ---- send + stream -----------------------------------------------------------------------
  const kindOf = st => st === "doc" ? "write" : st === "ocr" ? "local" : "read";
  const nameOf = st => st === "doc" ? "Writer" : st === "ocr" ? "OCR" : "Reader";

  async function send(retry) {
    const prompt = retry ? retry.prompt : ta.value.trim();
    const files = retry ? retry.files : state.files.slice();
    if (state.busy || (!prompt && !files.length)) return;
    state.busy = true; $("#send").disabled = true;
    state.last = { prompt, files };
    if (!retry) { ta.value = ""; grow(); state.files = []; renderPending(); }
    if (main.classList.contains("empty")) { main.classList.remove("empty"); $("#title").textContent = (prompt || files[0]?.name || "Chat").slice(0, 60); }
    state.turns++;

    const turn = document.createElement("section"); turn.className = "turn";
    turn.innerHTML = `
      <div class="you"><div class="bubble">${esc(prompt || "(files only)")}${files.length ? `<div>${files.map(f => `<span class="chip">${esc(f.name)}</span>`).join("")}</div>` : ""}</div></div>
      <div class="track"><span class="label">Routing…</span></div>
      <div class="answer"><span class="reading">Preparing your files…</span></div>`;
    $("#log").appendChild(turn);
    const track = $(".track", turn), answer = $(".answer", turn);
    const nodes = {}; let text = "", extracted = "";
    const scrollDown = () => { const s = $("#scroll"); s.scrollTop = s.scrollHeight; };
    scrollDown();

    const fd = new FormData();
    fd.append("prompt", prompt); fd.append("client_session", state.session);
    files.forEach(f => fd.append("files", f, f.name));

    const onEvent = (ev, data) => {
      if (ev === "session") { state.session = data.client_session; $("#sess").textContent = "session " + data.client_session.slice(0, 8); return; }
      if (ev === "route") {
        const keepOcr = nodes.ocr ? nodes.ocr.outerHTML + `<span class="link done"></span>` : "";
        track.innerHTML = `<span class="label">Routed to</span>` + keepOcr + data.stages.map((st, i) => {
          const model = st === "doc" ? state.models.doc : st === "vision" ? state.models.vision : "local";
          return (i ? `<span class="link"></span>` : "") + `<span class="node pending ${kindOf(st)}" data-stage="${st}"><b>${nameOf(st)}</b><span class="model">${esc(model)}</span><span class="t"></span></span>`;
        }).join("");
        track.querySelectorAll(".node").forEach(n => nodes[n.dataset.stage] = n);
        return;
      }
      if (ev === "stage") {
        let n = nodes[data.stage];
        if (!n && data.status === "start") {
          track.innerHTML = `<span class="label">Routed to</span><span class="node pending local" data-stage="ocr"><b>OCR</b><span class="model">tesseract</span><span class="t"></span></span>`;
          n = nodes.ocr = $(`.node[data-stage="ocr"]`, track);
        }
        if (!n) return;
        if (data.status === "start") {
          n.classList.remove("pending"); n.classList.add("active");
          if (data.stage === "vision") answer.innerHTML = `<span class="reading">Reading the document…</span>`;
          if (data.stage === "doc" && extracted) { text = ""; answer.innerHTML = `<span class="reading">Writing…</span>`; }
        } else {
          n.classList.remove("active"); n.classList.add("done");
          $(".t", n).textContent = data.seconds != null ? `${data.seconds}s` : "";
          const link = n.previousElementSibling; if (link && link.classList.contains("link")) link.classList.add("done");
          if (data.stage === "vision") extracted = text;
        }
        return;
      }
      if (ev === "delta") { text += data.text; answer.innerHTML = render(text) + `<span class="caret"></span>`; scrollDown(); return; }
      if (ev === "tool") {
        const n = nodes[data.stage]; if (!n) return;
        let t = $(".tool", n); if (!t) { t = document.createElement("span"); t.className = "tool"; n.appendChild(t); }
        t.textContent = data.status === "call" ? `${data.name}…` : `${data.name} ✓`; return;
      }
      if (ev === "done") { finish(turn, answer, track, data); return; }
      if (ev === "error") { fail(answer, track, data.error); return; }
    };

    try {
      const r = await fetch("/api/ask/stream", { method: "POST", body: fd });
      if (!r.ok || !r.body) { const d = await r.json().catch(() => ({})); fail(answer, track, d.detail || d.error || `Request failed (${r.status})`); }
      else await readSSE(r.body, onEvent);
    } catch (e) { fail(answer, track, "The workbench is not reachable: " + e.message); }
    state.busy = false; $("#send").disabled = false; ta.focus();
  }

  async function readSSE(body, onEvent) {
    const reader = body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let ev = "message", data = "";
        for (const line of chunk.split("\n")) { if (line.startsWith("event:")) ev = line.slice(6).trim(); else if (line.startsWith("data:")) data += line.slice(5).trim(); }
        if (data) { try { onEvent(ev, JSON.parse(data)); } catch (e) { console.error(e); } }
      }
    }
  }

  function finish(turn, answer, track, d) {
    answer.innerHTML = render(d.answer || "(no text returned)");
    if (d.files.length) {
      const wrap = document.createElement("div"); wrap.className = "files";
      wrap.innerHTML = d.files.map(f => `<a href="${f.url}" download><span class="ext">${esc(f.name.split(".").pop().toUpperCase())}</span>${esc(f.name.replace(/-\d{8}-\d{6}(?=\.\w+$)/, ""))}</a>`).join("");
      answer.appendChild(wrap);
    }
    const rows = d.routed.map(h => {
      const t = h.timings || {}; const bits = [`${h.seconds}s`];
      if (t.first_token != null) bits.push(`first word ${t.first_token}s`);
      if (t.tools) bits.push(`tools ${t.tools}s`);
      if (h.tool_calls.length) bits.push(h.tool_calls.join(", "));
      return `<b>${esc(h.agent)}</b><span>${esc(bits.join(" · "))}</span>`;
    }).join("");
    const how = document.createElement("details"); how.className = "how";
    how.innerHTML = `<summary>How this was handled — ${esc(d.route_reason)}${d.context_docs.length ? "; context from " + esc(d.context_docs.join(", ")) : ""}</summary>
      <div class="grid">${rows}</div>
      ${d.extracted && d.routed.length > 1 ? `<pre class="extract">${esc(d.extracted)}</pre>` : ""}
      <pre>${esc(d.trace.join("\n"))}</pre>`;
    turn.appendChild(how);
    track.querySelectorAll(".node").forEach(n => { n.classList.remove("active", "pending"); n.classList.add("done"); });
  }

  function fail(answer, track, message) {
    answer.className = "answer error";
    answer.innerHTML = `<div class="msg">${esc(message)}</div><div class="fix"><button type="button" class="starters-btn" id="retry" style="padding:6px 12px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer">Try again</button></div>`;
    track.querySelectorAll(".node.active").forEach(n => n.classList.remove("active"));
    $("#retry", answer).addEventListener("click", () => { state.busy = false; send(state.last); });
  }

  // ---- tiny markdown -------------------------------------------------------------------------
  function render(md) {
    const lines = md.replace(/\r/g, "").split("\n"); const out = []; let i = 0;
    const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<i>$2</i>");
    while (i < lines.length) {
      const l = lines[i];
      if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
      if (/^\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
        const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
        const head = cells(l); i += 2; const body = [];
        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]));
        out.push(`<table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`); continue;
      }
      const h = /^(#{1,6})\s+(.*)/.exec(l); if (h) { const lv = Math.min(h[1].length + 2, 4); out.push(`<h${lv}>${inline(h[2])}</h${lv}>`); i++; continue; }
      if (/^\s*[-*•]\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) items.push(inline(lines[i++].replace(/^\s*[-*•]\s+/, ""))); out.push(`<ul>${items.map(x => `<li>${x}</li>`).join("")}</ul>`); continue; }
      if (/^\s*\d+[.)]\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items.push(inline(lines[i++].replace(/^\s*\d+[.)]\s+/, ""))); out.push(`<ol>${items.map(x => `<li>${x}</li>`).join("")}</ol>`); continue; }
      if (!l.trim()) { i++; continue; }
      const para = []; while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*[-*•]\s|\s*\d+[.)]\s|\||```)/.test(lines[i])) para.push(lines[i++]);
      if (!para.length) { para.push(l); i++; }
      out.push(`<p>${inline(para.join(" "))}</p>`);
    }
    return out.join("");
  }
})();
</script>
</body>
</html>
